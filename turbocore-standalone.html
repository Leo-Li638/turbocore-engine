r-radius:var(--radius-s);padding:9px 18px;font-size:12px;box-shadow:0 4px 18px #00000080,0 0 16px #39e6ff26;animation:toast-in .25s ease-out,toast-out .3s ease-in 2.3s forwards;backdrop-filter:blur(6px)}.toast.warn{border-color:var(--warn)}@keyframes toast-in{0%{opacity:0;transform:translateY(12px)}}@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}#help-modal{position:fixed;inset:0;z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;background:#02060c99;backdrop-filter:blur(3px)}.help-card{width:min(430px,92vw);background:var(--panel-bg);border:1px solid var(--accent);border-radius:var(--radius-m);padding:16px 18px;box-shadow:0 10px 40px #000000b3,0 0 30px #39e6ff1f}.help-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:1px;margin-bottom:10px}.help-body{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px}.help-body .hk{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dashed rgba(57,230,255,.15)}.help-body kbd{font-family:var(--font-mono);background:#39e6ff1f;color:var(--accent);border:1px solid var(--panel-border);border-radius:4px;padding:1px 7px;font-size:11px}#drawer-scrim{position:fixed;inset:0;background:#02060c8c;z-index:65}.tc-label{pointer-events:none;display:flex;align-items:center;gap:3px;background:#040a14e0;border:1px solid rgba(57,230,255,.35);border-radius:6px;padding:2px 8px 2px 3px;white-space:nowrap;box-shadow:0 2px 10px #0000008c}.tc-label .lb-id{font-family:var(--font-mono);background:var(--accent);color:#02121c;font-weight:700;font-size:9px;padding:1px 5px;border-radius:4px;margin-right:3px}.tc-label .lb-zh{font-size:11px;color:#e8f4fa}.tc-label .lb-en{font-size:8px;color:var(--text-dim);letter-spacing:.5px}.tc-label.warm{border-color:#ff8a2b80}.tc-label.warm .lb-id{background:var(--warn)}@media (max-width: 768px){:root{--bottombar-h: 152px}.tb-drawer{display:inline-flex}.tb-center,.mode-tab .mode-zh{display:none}.mode-tab{padding:8px 10px}.mode-tab .mode-num{font-size:12px}.brand-sub{display:none}#left-panel,#right-panel{top:0;bottom:0;height:100%;border-radius:0;transform:translate(-110%);transition:transform .22s ease-out}#left-panel{left:0;width:min(82vw,300px)}#right-panel{right:0;width:min(84vw,322px);transform:translate(110%)}#left-panel.open,#right-panel.open{transform:translate(0)}#bottom-bar{flex-wrap:wrap;gap:8px;padding:8px 10px 12px}.bb-center{order:3;flex-basis:100%}.bb-left{order:1}.bb-right{order:2;margin-left:auto}#progress-slider{height:34px}.play-btn{width:50px;height:50px}.ctrl-btn{padding:10px 12px;min-height:44px}#hud-capsule{top:calc(var(--topbar-h) + 12px)}#hud-stats{top:calc(var(--topbar-h) + 46px)}}@media (max-width: 480px){.brand-sub,.hud-status-zh,#hud-stats{display:none}.bb-right .ctrl-btn:nth-child(2){display:none}.mode-tab{padding:8px 9px}.help-body{grid-template-columns:1fr}}

</style>
</head>
<body>
  <div id="app">
    <div id="viewport"></div>
    <div id="label-layer"></div>

    <div id="hud-capsule">
      <span class="hud-live"><i class="hud-dot"></i>REALTIME 3D</span>
      <span id="hud-status" class="hud-status">ASSEMBLY</span>
      <span id="hud-status-zh" class="hud-status-zh">完整装配状态</span>
    </div>
    <div id="hud-stats">
      <div>方位角 <span class="mono" id="hud-az">--°</span></div>
      <div>仰角 <span class="mono" id="hud-el">--°</span></div>
      <div>FPS <span class="mono" id="hud-fps">--</span></div>
      <div>三角面 <span class="mono" id="hud-tris">--</span></div>
      <div>DRAWCALL <span class="mono" id="hud-calls">--</span></div>
    </div>

    <header id="topbar">
      <div class="tb-left">
        <button id="btn-drawer-left" class="icon-btn tb-drawer" aria-label="打开结构树">☰</button>
        <div class="brand">
          <span class="brand-logo">◤</span>
          <div class="brand-text">
            <div class="brand-name">TURBOCORE</div>
            <div class="brand-sub">TC-X135 高涵道比涡扇发动机 · 数字孪生 3D 爆炸分解</div>
          </div>
        </div>
      </div>
      <div class="tb-center">
        <span class="status-dot"></span><span class="status-online">ONLINE</span>
        <span class="tb-sep">|</span><span class="mono" id="tb-model">TC-X135</span>
        <span class="tb-sep">|</span><span class="mono"><span id="tb-fps">--</span> FPS</span>
      </div>
      <div class="tb-right">
        <div class="mode-tabs" id="mode-tabs">
          <button class="mode-tab active" data-mode="assembly" title="装配模式 (1)"><span class="mode-num">01</span><span class="mode-zh">装配</span></button>
          <button class="mode-tab" data-mode="explode" title="分解模式 (2)"><span class="mode-num">02</span><span class="mode-zh">分解</span></button>
          <button class="mode-tab" data-mode="section" title="剖切模式 (3)"><span class="mode-num">03</span><span class="mode-zh">剖切</span></button>
        </div>
        <button id="btn-reset-view" class="icon-btn" title="重置视角 (V)">⌂</button>
        <button id="btn-help" class="icon-btn" title="快捷键帮助">?</button>
        <button id="btn-drawer-right" class="icon-btn tb-drawer" aria-label="打开部件检视">ⓘ</button>
      </div>
    </header>

    <aside id="left-panel" class="panel">
      <div class="panel-head">
        <div class="panel-title">部件结构树</div>
        <div class="panel-count mono" id="tree-count">24</div>
      </div>
      <div class="search-box"><input id="tree-search" type="text" placeholder="搜索部件（中文 / English）" autocomplete="off" /></div>
      <div id="tree-groups"></div>
      <div class="panel-section">
        <div class="panel-title small">DISPLAY CONTROL</div>
        <div id="display-switches"></div>
        <div id="clip-slider-box" class="off">
          <div class="switch-row"><label>剖切平面 Y</label><span class="mono" id="clip-val">+0.15 m</span></div>
          <input type="range" id="clip-slider" min="-1.3" max="1.3" step="0.05" value="0.15" />
        </div>
        <div class="tree-footer">
          <span class="mono" id="visible-count">24/24</span><span class="dim"> 可见</span>
          <button id="btn-show-all" class="mini-btn">全部显示</button>
        </div>
      </div>
    </aside>

    <aside id="right-panel" class="panel">
      <div class="panel-head">
        <div class="panel-title">部件检视</div>
        <div class="panel-count mono" id="inspector-id">OVERVIEW</div>
      </div>
      <div id="inspector-scroll"></div>
    </aside>

    <footer id="bottom-bar">
      <div class="bb-left">
        <button id="btn-play" class="play-btn" title="播放/暂停 (Space)">
          <span class="play-icon" id="play-icon">▶</span><span id="play-label">播放</span>
        </button>
        <button id="btn-reverse" class="ctrl-btn" title="反向播放 (R)"><span class="rev-icon">◀</span>反向</button>
      </div>
      <div class="bb-center">
        <div class="bb-labels">
          <span class="mono dim">ASSEMBLED · 0%</span>
          <span class="mono pct" id="progress-pct">0%</span>
          <span class="mono dim">EXPLODED · 100%</span>
        </div>
        <div class="slider-track">
          <div class="seg-marks" id="seg-marks"></div>
          <input type="range" id="progress-slider" min="0" max="100" step="1" value="0" aria-label="分解进度" />
        </div>
        <div class="seg-row" id="seg-row"></div>
      </div>
      <div class="bb-right">
        <button id="btn-reassemble" class="ctrl-btn warn" title="重新装配 (A)">重新装配</button>
        <button id="btn-reset-view2" class="ctrl-btn" title="重置视角">重置视角</button>
        <button id="btn-section-view" class="ctrl-btn" title="本体/剖切视图">本体/剖切视图</button>
      </div>
    </footer>

    <div id="toast-stack"></div>
    <div id="drawer-scrim" class="hidden"></div>
    <div id="help-modal" class="hidden">
      <div class="help-card">
        <div class="help-head"><span>操作快捷键</span><button id="btn-help-close" class="mini-btn">关闭 ×</button></div>
        <div class="help-body" id="help-body"></div>
      </div>
    </div>
  </div>
</body>
</html>
